name: Refresh contribution graphics

on:
  schedule:
    - cron: "17 1 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SVGs
        run: python scripts/contrib.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: Naveenp7
          # optional: add a PAT as secret GH_PAT to include private contributions
          GH_PAT: ${{ secrets.GH_PAT }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-stats.svg assets/contrib-heatmap.svg
          git diff --cached --quiet || (git commit -m "chore: refresh contribution graphics" && git push)
