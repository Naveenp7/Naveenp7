.i{font-style:italic} .b{font-weight:600}
</style><defs>
<filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .25  0 0 0 0 .25  0 0 0 .10 0"/></filter>
</defs><clipPath id="c"><rect width="900" height="400" rx="22"/></clipPath><rect width="900" height="400" rx="22" fill="#F2F2F0"/><g clip-path="url(#c)"><rect width="900" height="400" filter="url(#n)"/></g><rect x="44" y="44" width="11" height="11" rx="2.5" fill="#22C55E"/><text x="64" y="54" class="m" font-size="12" fill="#6B6B66" letter-spacing="2" >MINDSET</text><text x="44" y="112" class="s" font-size="50" fill="#111111">How I <tspan class="i" fill="#22C55E">think</tspan></text><rect x="44.0" y="146" width="192.5" height="214" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="64.0" y="146" width="44" height="6" rx="3" fill="#2F55FF"/><text x="64.0" y="220" class="s i" font-size="50" fill="#2F55FF" >01</text><text x="64.0" y="260" class="s" font-size="27" fill="#111111" >Design</text><text x="64.0" y="288" class="s i" font-size="27" fill="#111111" >First</text><text x="64.0" y="318" class="p" font-size="12.5" fill="#6B6B66" >Plan the blueprint</text><text x="64.0" y="335" class="p" font-size="12.5" fill="#6B6B66" >before laying bricks.</text><rect x="250.5" y="146" width="192.5" height="214" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="270.5" y="146" width="44" height="6" rx="3" fill="#EF3B2D"/><text x="270.5" y="220" class="s i" font-size="50" fill="#EF3B2D" >02</text><text x="270.5" y="260" class="s" font-size="27" fill="#111111" >Fast &amp;</text><text x="270.5" y="288" class="s i" font-size="27" fill="#111111" >Reliable</text><text x="270.5" y="318" class="p" font-size="12.5" fill="#6B6B66" >Nobody likes waiting —</text><text x="270.5" y="335" class="p" font-size="12.5" fill="#6B6B66" >or crashes.</text><rect x="457.0" y="146" width="192.5" height="214" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="477.0" y="146" width="44" height="6" rx="3" fill="#FFC81E"/><text x="477.0" y="220" class="s i" font-size="50" fill="#FFC81E" >03</text><text x="477.0" y="260" class="s" font-size="27" fill="#111111" >Cost</text><text x="477.0" y="288" class="s i" font-size="27" fill="#111111" >Aware</text><text x="477.0" y="318" class="p" font-size="12.5" fill="#6B6B66" >Smart and simple beats</text><text x="477.0" y="335" class="p" font-size="12.5" fill="#6B6B66" >big and expensive.</text><rect x="663.5" y="146" width="192.5" height="214" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="683.5" y="146" width="44" height="6" rx="3" fill="#111111"/><text x="683.5" y="220" class="s i" font-size="50" fill="#111111" >04</text><text x="683.5" y="260" class="s" font-size="27" fill="#111111" >Production</text><text x="683.5" y="288" class="s i" font-size="27" fill="#111111" >Ready</text><text x="683.5" y="318" class="p" font-size="12.5" fill="#6B6B66" >Secure, tested, and</text><text x="683.5" y="335" class="p" font-size="12.5" fill="#6B6B66" >easy to maintain.</text></svg>