<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="How I think: design first, fast and reliable, cost aware, production ready."><title>How I think: design first, fast and reliable, cost aware, production ready.</title><style>
