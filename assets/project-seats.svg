</style><defs><filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .25  0 0 0 0 .25  0 0 0 .10 0"/></filter></defs><rect x=".5" y=".5" width="439" height="193" rx="18" fill="#111111"/><text x="24" y="52" class="s" font-size="28" fill="#fff">Movie Seat <tspan class="i" fill="#fff">Manager</tspan></text><text x="416" y="50" class="m" font-size="10.5" fill="#fff" text-anchor="end" letter-spacing="1.5" opacity="0.85">VIEW ↗</text><text x="24" y="80" class="p" font-size="13" fill="#fff" opacity="0.95">A ticket booking system where two people can never book</text><text x="24" y="99" class="p" font-size="13" fill="#fff" opacity="0.95">the same seat — even at the exact same second.</text><text x="24" y="130" class="p" font-size="12" fill="#fff"><tspan fill-opacity=".6">Uses:</tspan> distributed locks · idempotency · transactions</text><rect x="24.0" y="150" width="57.2" height="24" rx="12.0" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.4"/><text x="52.6" y="165.6" class="m" font-size="10" fill="#fff" text-anchor="middle">.NET 8</text><rect x="87.2" y="150" width="82.0" height="24" rx="12.0" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.4"/><text x="128.2" y="165.6" class="m" font-size="10" fill="#fff" text-anchor="middle">PostgreSQL</text><rect x="175.2" y="150" width="51.0" height="24" rx="12.0" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.4"/><text x="200.7" y="165.6" class="m" font-size="10" fill="#fff" text-anchor="middle">Redis</text></svg>