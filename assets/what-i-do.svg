<svg xmlns="http://www.w3.org/2000/svg" width="900" height="436" viewBox="0 0 900 436" role="img" aria-label="What I do: LLMs and RAG, computer vision, backend engineering and cloud deployment."><title>What I do: LLMs and RAG, computer vision, backend engineering and cloud deployment.</title><style>
.s{font-family:'Instrument Serif','Playfair Display',Georgia,'Times New Roman',serif} .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .p{font-family:Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.i{font-style:italic} .b{font-weight:600}
</style><defs><filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .25  0 0 0 0 .25  0 0 0 .10 0"/></filter></defs><clipPath id="c"><rect width="900" height="436" rx="18"/></clipPath><rect width="900" height="436" rx="18" fill="#F2F2F0"/><g clip-path="url(#c)"><rect width="900" height="436" filter="url(#n)"/></g><rect x="28" y="28" width="9" height="9" rx="2" fill="#2F55FF"/><text x="46" y="36" class="m" font-size="11" fill="#6B6B66" letter-spacing="2">FOCUS AREAS</text><text x="28" y="72" class="s" font-size="30" fill="#111111">What I <tspan class="i" fill="#2F55FF">do</tspan></text><rect x="28.0" y="92" width="416.0" height="152" rx="14" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="48.0" y="112" width="8" height="8" rx="2" fill="#2F55FF"/><text x="64.0" y="122" class="s" font-size="20" fill="#111111">Teach computers <tspan class="i" fill="#2F55FF">to read &amp; answer</tspan></text><text x="48.0" y="150" class="p" font-size="12.5" fill="#3A3A36">I build chat assistants that read your documents and</text><text x="48.0" y="168" class="p" font-size="12.5" fill="#3A3A36">answer questions from them — accurately, with sources.</text><rect x="48.0" y="202" width="54.6" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="60.0" cy="213.0" r="2.8" fill="#2F55FF"/><text x="80.8" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">LLMs</text><rect x="107.6" y="202" width="48.7" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="119.6" cy="213.0" r="2.8" fill="#2F55FF"/><text x="137.4" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">RAG</text><rect x="161.2" y="202" width="89.9" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="173.2" cy="213.0" r="2.8" fill="#2F55FF"/><text x="211.7" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">Embeddings</text><rect x="256.1" y="202" width="107.6" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="268.1" cy="213.0" r="2.8" fill="#2F55FF"/><text x="315.4" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">Vector Search</text><rect x="368.7" y="202" width="48.7" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="380.7" cy="213.0" r="2.8" fill="#2F55FF"/><text x="398.5" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">NLP</text><rect x="456.0" y="92" width="416.0" height="152" rx="14" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="476.0" y="112" width="8" height="8" rx="2" fill="#EF3B2D"/><text x="492.0" y="122" class="s" font-size="20" fill="#111111">Teach computers <tspan class="i" fill="#EF3B2D">to see</tspan></text><text x="476.0" y="150" class="p" font-size="12.5" fill="#3A3A36">I build systems that look at images and video and</text><text x="476.0" y="168" class="p" font-size="12.5" fill="#3A3A36">understand them — counting people, spotting objects,</text><text x="476.0" y="186" class="p" font-size="12.5" fill="#3A3A36">measuring crowds.</text><rect x="476.0" y="202" width="119.3" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="488.0" cy="213.0" r="2.8" fill="#EF3B2D"/><text x="541.2" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">Computer Vision</text><rect x="600.4" y="202" width="54.6" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="612.4" cy="213.0" r="2.8" fill="#EF3B2D"/><text x="633.1" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">YOLO</text><rect x="659.9" y="202" width="66.3" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="671.9" cy="213.0" r="2.8" fill="#EF3B2D"/><text x="698.6" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">OpenCV</text><rect x="731.3" y="202" width="78.1" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="743.3" cy="213.0" r="2.8" fill="#EF3B2D"/><text x="775.8" y="216.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">Roboflow</text><rect x="28.0" y="256" width="416.0" height="152" rx="14" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="48.0" y="276" width="8" height="8" rx="2" fill="#FFC81E"/><text x="64.0" y="286" class="s" font-size="20" fill="#111111">Build the engine <tspan class="i" fill="#D9A000">behind apps</tspan></text><text x="48.0" y="314" class="p" font-size="12.5" fill="#3A3A36">I build the servers and databases that keep apps fast,</text><text x="48.0" y="332" class="p" font-size="12.5" fill="#3A3A36">safe and reliable — even when thousands of people use</text><text x="48.0" y="350" class="p" font-size="12.5" fill="#3A3A36">them at once.</text><rect x="48.0" y="366" width="72.2" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="60.0" cy="377.0" r="2.8" fill="#FFC81E"/><text x="89.6" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">FastAPI</text><rect x="125.2" y="366" width="54.6" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="137.2" cy="377.0" r="2.8" fill="#FFC81E"/><text x="158.0" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">.NET</text><rect x="184.8" y="366" width="89.9" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="196.8" cy="377.0" r="2.8" fill="#FFC81E"/><text x="235.2" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">PostgreSQL</text><rect x="279.7" y="366" width="60.5" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="291.7" cy="377.0" r="2.8" fill="#FFC81E"/><text x="315.4" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">Redis</text><rect x="345.1" y="366" width="54.6" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="357.1" cy="377.0" r="2.8" fill="#FFC81E"/><text x="377.9" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">APIs</text><rect x="456.0" y="256" width="416.0" height="152" rx="14" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="476.0" y="276" width="8" height="8" rx="2" fill="#111111"/><text x="492.0" y="286" class="s" font-size="20" fill="#111111">Cloud <tspan class="i" fill="#111111">Deployment</tspan></text><text x="476.0" y="314" class="p" font-size="12.5" fill="#3A3A36">I deploy applications to the cloud so they&#x27;re live,</text><text x="476.0" y="332" class="p" font-size="12.5" fill="#3A3A36">scalable and available 24/7 for everyone to use.</text><rect x="476.0" y="366" width="66.3" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="488.0" cy="377.0" r="2.8" fill="#111111"/><text x="514.7" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">Docker</text><rect x="547.3" y="366" width="48.7" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="559.3" cy="377.0" r="2.8" fill="#111111"/><text x="577.2" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">GCP</text><rect x="601.0" y="366" width="66.3" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="613.0" cy="377.0" r="2.8" fill="#111111"/><text x="639.7" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">Vercel</text><rect x="672.4" y="366" width="60.5" height="22" rx="11.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.3"/><circle cx="684.4" cy="377.0" r="2.8" fill="#111111"/><text x="708.1" y="380.6" class="m" font-size="9.5" fill="#111111" text-anchor="middle">CI/CD</text></svg>