<filter id="n" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .25  0 0 0 0 .25  0 0 0 0 .25  0 0 0 .10 0"/></filter>
</defs><clipPath id="c"><rect width="900" height="704" rx="22"/></clipPath><rect width="900" height="704" rx="22" fill="#F2F2F0"/><g clip-path="url(#c)"><rect width="900" height="704" filter="url(#n)"/></g><rect x="44" y="44" width="11" height="11" rx="2.5" fill="#2F55FF"/><text x="64" y="54" class="m" font-size="12" fill="#6B6B66" letter-spacing="2" >WHAT I DO</text><text x="856" y="54" class="m" font-size="12" fill="#6B6B66" text-anchor="end" letter-spacing="2" >IDEA → PRODUCT</text><text x="44" y="112" class="s" font-size="50" fill="#111111">Explained, <tspan class="i" fill="#2F55FF">simply</tspan></text><rect x="44" y="146" width="409" height="250" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="66" y="170" width="10" height="10" rx="2.5" fill="#2F55FF"/><text x="84" y="179" class="m" font-size="12" fill="#6B6B66" letter-spacing="2" >01</text><text x="66" y="222" class="s" font-size="25" fill="#111111">Teach computers <tspan class="i" fill="#2F55FF">to read &amp; answer</tspan></text><text x="66" y="254" class="p" font-size="13.5" fill="#3A3A36" >I build chat assistants that read your documents</text><text x="66" y="273" class="p" font-size="13.5" fill="#3A3A36" >and answer questions from them — accurately, with</text><text x="66" y="292" class="p" font-size="13.5" fill="#3A3A36" >sources.</text><rect x="66.0" y="316" width="60.0" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="80.0" cy="329.0" r="3" fill="#2F55FF"/><text x="102.0" y="333.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >LLMs</text><rect x="132.0" y="316" width="53.5" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="146.0" cy="329.0" r="3" fill="#2F55FF"/><text x="164.8" y="333.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >RAG</text><rect x="191.6" y="316" width="99.1" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="205.6" cy="329.0" r="3" fill="#2F55FF"/><text x="247.1" y="333.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >Embeddings</text><rect x="296.7" y="316" width="118.6" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="310.7" cy="329.0" r="3" fill="#2F55FF"/><text x="362.0" y="333.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >Vector Search</text><rect x="66.0" y="348" width="53.5" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="80.0" cy="361.0" r="3" fill="#2F55FF"/><text x="98.8" y="365.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >NLP</text><rect x="467" y="146" width="409" height="250" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="489" y="170" width="10" height="10" rx="2.5" fill="#EF3B2D"/><text x="507" y="179" class="m" font-size="12" fill="#6B6B66" letter-spacing="2" >02</text><text x="489" y="222" class="s" font-size="25" fill="#111111">Teach computers <tspan class="i" fill="#EF3B2D">to see</tspan></text><text x="489" y="254" class="p" font-size="13.5" fill="#3A3A36" >I build systems that look at images and video and</text><text x="489" y="273" class="p" font-size="13.5" fill="#3A3A36" >understand them — counting people, spotting</text><text x="489" y="292" class="p" font-size="13.5" fill="#3A3A36" >objects, measuring crowds.</text><rect x="489.0" y="316" width="131.7" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="503.0" cy="329.0" r="3" fill="#EF3B2D"/><text x="560.8" y="333.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >Computer Vision</text><rect x="626.6" y="316" width="60.0" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="640.6" cy="329.0" r="3" fill="#EF3B2D"/><text x="662.7" y="333.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >YOLO</text><rect x="692.7" y="316" width="73.1" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="706.7" cy="329.0" r="3" fill="#EF3B2D"/><text x="735.2" y="333.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >OpenCV</text><rect x="489.0" y="348" width="86.1" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="503.0" cy="361.0" r="3" fill="#EF3B2D"/><text x="538.0" y="365.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >Roboflow</text><rect x="44" y="410" width="409" height="250" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="66" y="434" width="10" height="10" rx="2.5" fill="#FFC81E"/><text x="84" y="443" class="m" font-size="12" fill="#6B6B66" letter-spacing="2" >03</text><text x="66" y="486" class="s" font-size="25" fill="#111111">Build the engine <tspan class="i" fill="#D9A000">behind apps</tspan></text><text x="66" y="518" class="p" font-size="13.5" fill="#3A3A36" >I build the servers and databases that keep apps</text><text x="66" y="537" class="p" font-size="13.5" fill="#3A3A36" >fast, safe and reliable — even when thousands of</text><text x="66" y="556" class="p" font-size="13.5" fill="#3A3A36" >people use them at once.</text><rect x="66.0" y="580" width="79.6" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="80.0" cy="593.0" r="3" fill="#FFC81E"/><text x="111.8" y="597.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >FastAPI</text><rect x="151.6" y="580" width="60.0" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="165.6" cy="593.0" r="3" fill="#FFC81E"/><text x="187.6" y="597.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >.NET</text><rect x="217.6" y="580" width="99.1" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="231.6" cy="593.0" r="3" fill="#FFC81E"/><text x="273.2" y="597.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >PostgreSQL</text><rect x="322.7" y="580" width="66.5" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="336.7" cy="593.0" r="3" fill="#FFC81E"/><text x="362.0" y="597.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >Redis</text><rect x="66.0" y="612" width="60.0" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="80.0" cy="625.0" r="3" fill="#FFC81E"/><text x="102.0" y="629.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >APIs</text><rect x="467" y="410" width="409" height="250" rx="20" fill="#FBFBFA" stroke="#DCDCD6"/><rect x="489" y="434" width="10" height="10" rx="2.5" fill="#111111"/><text x="507" y="443" class="m" font-size="12" fill="#6B6B66" letter-spacing="2" >04</text><text x="489" y="486" class="s" font-size="25" fill="#111111">Cloud <tspan class="i" fill="#111111">Deployment</tspan></text><text x="489" y="518" class="p" font-size="13.5" fill="#3A3A36" >I deploy applications to the cloud so they&#x27;re live,</text><text x="489" y="537" class="p" font-size="13.5" fill="#3A3A36" >scalable and available 24/7 for everyone to use.</text><rect x="489.0" y="612" width="73.1" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="503.0" cy="625.0" r="3" fill="#111111"/><text x="531.5" y="629.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >Docker</text><rect x="568.1" y="612" width="53.5" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="582.1" cy="625.0" r="3" fill="#111111"/><text x="600.8" y="629.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >GCP</text><rect x="627.6" y="612" width="73.1" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="641.6" cy="625.0" r="3" fill="#111111"/><text x="670.1" y="629.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >Vercel</text><rect x="706.6" y="612" width="66.5" height="26" rx="13.0" fill="none" fill-opacity="1" stroke="#111111" stroke-opacity="0.25"/><circle cx="720.6" cy="625.0" r="3" fill="#111111"/><text x="745.9" y="629.0" class="m" font-size="10.5" fill="#111111" text-anchor="middle" >CI/CD</text></svg>