<svg width="1200" height="330" viewBox="0 0 1200 330"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg"
      x1="0%" y1="0%"
      x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b12"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="accent"
      x1="0%" y1="0%"
      x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid"
      width="32"
      height="32"
      patternUnits="userSpaceOnUse">

      <path d="M 32 0 L 0 0 0 32"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.035"
            stroke-width="1"/>

    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

  </defs>

  <!-- Background -->
  <rect width="1200" height="330" rx="22"
        fill="url(#bg)"/>

  <!-- Grid -->
  <rect width="1200" height="330" rx="22"
        fill="url(#grid)"/>

  <!-- Ambient glow -->
  <circle cx="1010" cy="70"
          r="210"
          fill="url(#glow)"
          filter="url(#blur)"/>

  <circle cx="180" cy="280"
          r="180"
          fill="url(#glow)"
          filter="url(#blur)"/>

  <!-- Decorative architecture lines -->

  <g opacity="0.22"
     stroke="url(#accent)"
     fill="none"
     stroke-width="1">

    <path d="M760 35 L1140 35"/>
    <path d="M810 65 L1170 65"/>
    <path d="M850 95 L1110 95"/>

    <path d="M900 35 L900 190"/>
    <path d="M960 35 L960 220"/>
    <path d="M1020 35 L1020 180"/>
    <path d="M1080 35 L1080 240"/>

  </g>

  <!-- Small system nodes -->

  <g fill="#818cf8">

    <circle cx="900" cy="190" r="4"/>
    <circle cx="960" cy="220" r="4"/>
    <circle cx="1020" cy="180" r="4"/>
    <circle cx="1080" cy="240" r="4"/>

  </g>

  <!-- Main content -->

  <text x="70"
        y="92"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        letter-spacing="4">

    AI / ML ENGINEER

  </text>

  <text x="70"
        y="145"
        fill="#f8fafc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="44"
        font-weight="700">

    Naveen

  </text>

  <text x="70"
        y="184"
        fill="#cbd5e1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20">

    AI/ML Engineer · Solutions Architect · Builder

  </text>

  <!-- Accent line -->

  <rect x="70"
        y="210"
        width="150"
        height="3"
        rx="2"
        fill="url(#accent)"/>

  <!-- Description -->

  <text x="70"
        y="250"
        fill="#94a3b8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15">

    Designing intelligent systems that are practical, scalable and production-ready.

  </text>

  <!-- Right-side architecture label -->

  <g font-family="monospace"
     font-size="13"
     fill="#64748b">

    <text x="870" y="280">RAG</text>
    <text x="920" y="280">LLM</text>
    <text x="970" y="280">API</text>
    <text x="1015" y="280">DB</text>
    <text x="1060" y="280">AI</text>

  </g>

</svg>
